name: Kiểm tra

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Bộ máy thiệp, mẫu và ứng dụng web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiểm tra bộ máy thiệp và hợp đồng mẫu
        run: npm test
      - name: Build ứng dụng Next.js
        run: npm run build
      - name: Lint và kiểu dữ liệu
        run: npm run lint && npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Mở thử thiệp ở mọi mức chuyển động
        run: |
          (cd apps/web && npx next start -p 3000) &
          npx --yes wait-on@8.0.3 -t 60000 http://localhost:3000/demo/cuon-phim/
          npm run test:smoke
