name: Kiểm tra

on:
  pull_request:
  push:
    branches: [main, redesign]

jobs:
  legacy:
    name: Thiệp bản 1 (legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: index.html của mọi thiệp khớp với invite.json
        working-directory: legacy
        run: |
          node scripts/build.mjs
          git diff --exit-code -- '*/index.html' || (echo "::error::Hãy chạy 'node scripts/build.mjs' trong legacy/ rồi commit lại index.html" && exit 1)
      - run: npx playwright install --with-deps chromium
      - name: Mở thử từng thiệp
        run: npm test -w @sayhello/legacy

  v2:
    name: Bộ máy thiệp + ứng dụng bản 2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kiểm tra bộ máy thiệp
        run: npm test -w @sayhello/engine
      - name: Build ứng dụng Next.js
        run: npm run build -w @sayhello/web
      - run: npx playwright install --with-deps chromium
      - name: Mở thử thiệp bản 2 ở mọi mức chuyển động
        run: |
          node legacy/scripts/serve.mjs 3001 &
          (cd apps/web && npx next start -p 3000) &
          npx --yes wait-on@8.0.3 -t 60000 http://localhost:3000/v2/demo/cuon-phim/ http://localhost:3001/
          node apps/web/tests/thiep-v2.mjs http://localhost:3000
