<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Studio · Sửa thiệp cưới</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>SayHello</b> <i>Studio</i></div>
  <p class="who" id="who">Đang tải thiệp…</p>
  <div class="top-actions">
    <span class="status" id="status" role="status"></span>
    <button class="btn ghost" id="download" type="button" hidden>Tải file nội dung</button>
    <button class="btn" id="save" type="button" disabled>Lưu &amp; cập nhật thiệp</button>
  </div>
</header>

<nav class="mobile-tabs" aria-label="Chế độ">
  <button type="button" data-pane="edit" class="on">Sửa nội dung</button>
  <button type="button" data-pane="preview">Xem trước</button>
</nav>

<div class="layout">
  <section class="pane edit on" id="edit" aria-label="Nội dung thiệp">
    <div class="draft" id="draft" hidden>
      <p>Có bản nháp chưa lưu từ lần trước.</p>
      <button type="button" class="btn small" id="draftUse">Dùng bản nháp</button>
      <button type="button" class="btn small ghost" id="draftDrop">Bỏ</button>
    </div>
    <form id="form" autocomplete="off" novalidate></form>
  </section>

  <section class="pane preview" id="preview" aria-label="Xem trước">
    <div class="pv-bar">
      <div class="seg" id="device" role="group" aria-label="Thiết bị">
        <button type="button" data-v="phone" class="on">Điện thoại</button>
        <button type="button" data-v="tablet">Máy tính bảng</button>
        <button type="button" data-v="desktop">Máy tính</button>
      </div>
      <div class="seg" id="view" role="group" aria-label="Phần thiệp">
        <button type="button" data-v="cover">Bìa</button>
        <button type="button" data-v="inside" class="on">Bên trong</button>
      </div>
      <label class="guest">Xem như khách <input id="guest" placeholder="vd. Chị Lan" maxlength="60"></label>
      <a class="open-link" id="openLink" target="_blank" rel="noopener">Mở thiệp thật ↗</a>
    </div>
    <div class="stage" id="stage">
      <div class="device phone" id="frameWrap"><iframe id="frame" title="Xem trước thiệp"></iframe></div>
    </div>
  </section>
</div>

<script type="module" src="studio.js"></script>
</body>
</html>
