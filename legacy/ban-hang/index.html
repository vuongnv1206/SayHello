<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Bảng bán hàng · SayHello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  /* Trang tổng hợp của người bán: đơn hàng, đơn chờ tiền, đám cưới sắp tới, số liệu từng thiệp. Đọc từ Google Sheet qua Apps Script. */
  :root { --bg: #f6f2ec; --panel: #fffdf9; --ink: #26211d; --soft: #7b6f63; --line: #e6ddd1; --accent: #8e1b2c; --ok: #2f7a4f; --warn: #b26a00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 'Be Vietnam Pro', system-ui, sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 22px 16px 60px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; margin-bottom: 18px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 34px; flex: 1; }
  header small { color: var(--soft); font-size: 12.5px; }
  h2 { font-size: 15px; font-weight: 600; margin: 26px 0 10px; display: flex; gap: 8px; align-items: baseline; }
  h2 small { font-weight: 400; color: var(--soft); font-size: 12.5px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .stat b { display: block; font-size: 28px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--soft); font-size: 13px; }
  .stat.hi b { color: var(--warn); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 11.5px; font-weight: 600; color: var(--soft); text-transform: uppercase; letter-spacing: .05em; background: var(--panel); white-space: nowrap; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  td small, .muted { color: var(--soft); font-size: 12.5px; }
  .code { font-family: ui-monospace, monospace; font-weight: 600; letter-spacing: .04em; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; background: #eee6da; }
  .pill.wait { background: #fff1d6; color: var(--warn); }
  .pill.paid { background: #e1f0e6; color: var(--ok); }
  .pill.done { background: #e4e8f2; color: #3b4f7a; }
  .pill.off { background: #f0e4e4; color: var(--soft); text-decoration: line-through; }
  .days { font-weight: 600; white-space: nowrap; }
  .days.soon { color: var(--accent); }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .acts a, .acts button { border: 1px solid var(--line); background: #fff; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; text-decoration: none; color: var(--ink); white-space: nowrap; }
  .acts button.main { background: var(--ink); color: #fff; border-color: var(--ink); }
  .msg { padding: 26px; text-align: center; color: var(--soft); }
  .help { margin-top: 30px; color: var(--soft); font-size: 13px; line-height: 1.6; }
  @media (max-width: 640px) { th, td { padding: 8px 10px; } .hide-sm { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Bảng bán hàng</h1><small id="updated"></small><a id="refresh" href="#">Tải lại</a></header>
  <div id="app"><p class="msg">Đang tải…</p></div>
  <p class="help">Đổi trạng thái đơn ngay trong Google Sheet (tab <b>_Đơn hàng</b>, cột Trạng thái): <i>Chờ chuyển khoản</i> → <i>Đã nhận tiền</i> → <i>Đã giao</i>, hoặc <i>Đã hủy</i>.
    Mỗi sáng Apps Script tự gửi email nhắc các đám cưới còn 7 ngày và 1 ngày (bật bằng hàm <code>caiDatTuDong</code>, xem backend/HUONG-DAN.md).</p>
</div>
<script type="module">
  const $ = s => document.querySelector(s);
  const key = new URLSearchParams(location.search).get('ma') || '';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => (Number(n) || 0).toLocaleString('vi-VN') + 'đ';
  const dmy = ymd => ymd ? ymd.slice(0, 10).split('-').reverse().join('/') : '';
  const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
  const today = () => { const t = new Date(Date.now() + 7 * 3600e3); return t.toISOString().slice(0, 10); }; // ngày theo giờ Việt Nam
  const daysTo = ymd => Math.round((Date.parse(ymd + 'T00:00:00Z') - Date.parse(today() + 'T00:00:00Z')) / 864e5);
  const site = location.origin;

  // Trạng thái đơn → nhóm
  const kind = s => /\bh[uủ]y\b/i.test(s) ? 'off' : /giao/i.test(s) ? 'done' : /nhận|đã chuyển|xong/i.test(s) ? 'paid' : 'wait';
  const KIND_TEXT = { wait: 'Chờ tiền', paid: 'Đã nhận tiền', done: 'Đã giao', off: 'Đã hủy' };

  // Lời nhắc gửi cặp đôi (giống email Apps Script gửi mỗi sáng)
  function reminder(w, k) {
    const whenTxt = w.days === 0 ? 'hôm nay' : w.days === 1 ? 'ngày mai' : `${w.days} ngày nữa`;
    return `Chúc mừng hai bạn, ${whenTxt} là ngày vui rồi! Danh sách khách đã xác nhận và lời chúc của mọi người ở đây:\n`
      + `${site}/studio/khach.html?thiep=${w.slug}&ma=${k}\n`
      + `Nếu cần sửa giờ, địa chỉ hay câu chữ trên thiệp: ${site}/studio/?thiep=${w.slug}&ma=${k}`;
  }

  async function inviteDate(slug) {
    try { const d = await (await fetch(`../${slug}/invite.json`, { cache: 'no-cache' })).json(); return (d.date || '').slice(0, 10); }
    catch { return ''; }
  }

  async function load() {
    const app = $('#app');
    let shop;
    try { shop = await (await fetch('../shop.json', { cache: 'no-cache' })).json(); } catch { shop = {}; }
    const url = shop.orderSheetUrl;
    if (!url) { app.innerHTML = '<p class="msg">Chưa nối Google Sheet (thiếu <code>orderSheetUrl</code> trong shop.json).</p>'; return; }
    if (!key) { app.innerHTML = '<p class="msg">Link thiếu mã. Lấy link đúng bằng lệnh <code>npm run studio-link -- --ban-hang</code>.</p>'; return; }
    let d;
    try { d = await (await fetch(url + (url.includes('?') ? '&' : '?') + new URLSearchParams({ type: 'admin', key }))).json(); }
    catch { app.innerHTML = '<p class="msg">Không đọc được dữ liệu. Kiểm tra mạng, hoặc Apps Script chưa được triển khai bản mới.</p>'; return; }
    if (d.error) { app.innerHTML = '<p class="msg">' + (d.error === 'key' ? 'Mã không đúng. Lấy link bằng lệnh <code>npm run studio-link -- --ban-hang</code>.' : 'Apps Script chưa có trang tổng hợp: hãy dán bản mới và triển khai lại (xem backend/HUONG-DAN.md).') + '</p>'; return; }
    render(d);
  }

  async function render(d) {
    const orders = d.orders || [], invites = d.invites || [], keys = d.keys || {}, content = d.content || {};
    const stats = { all: orders.length, wait: 0, paid: 0, done: 0, off: 0, revenue: 0 };
    orders.forEach(o => { const k = kind(o.status); stats[k]++; if (k === 'paid' || k === 'done') stats.revenue += o.price; });

    // Ngày cưới mỗi thiệp: cặp đôi sửa trong Studio > invite.json trên web > ngày ghi trong đơn
    const bySlug = new Map();
    orders.forEach(o => { if (o.slug && kind(o.status) !== 'off' && !bySlug.has(o.slug)) bySlug.set(o.slug, { slug: o.slug, order: o }); });
    invites.forEach(i => { if (!bySlug.has(i.slug)) bySlug.set(i.slug, { slug: i.slug }); });
    const rows = [...bySlug.values()];
    await Promise.all(rows.map(async r => {
      r.stats = invites.find(i => i.slug === r.slug) || {};
      r.date = content[r.slug]?.date || await inviteDate(r.slug) || r.order?.date || '';
      r.days = r.date ? daysTo(r.date) : null;
    }));
    const upcoming = rows.filter(r => r.days !== null && r.days >= 0 && r.days <= 30).sort((a, b) => a.days - b.days);
    const waiting = orders.filter(o => kind(o.status) === 'wait');
    const names = r => r.order ? `${esc(r.order.groom)} &amp; ${esc(r.order.bride)}` : '';
    const zalo = p => { const n = String(p || '').replace(/\D/g, ''); return n ? `<a href="https://zalo.me/${n}" target="_blank" rel="noopener">Zalo</a>` : ''; };
    const links = slug => keys[slug] ? `<a href="../studio/?thiep=${slug}&ma=${keys[slug]}" target="_blank">Studio</a><a href="../studio/khach.html?thiep=${slug}&ma=${keys[slug]}" target="_blank">Khách</a>` : '';

    $('#updated').textContent = 'Cập nhật ' + when(d.now || new Date().toISOString());
    $('#app').innerHTML = `
      <div class="stats">
        <div class="stat"><b>${stats.all}</b><span>Tổng đơn</span></div>
        <div class="stat hi"><b>${stats.wait}</b><span>Chờ chuyển khoản</span></div>
        <div class="stat"><b>${stats.paid}</b><span>Đã nhận tiền, chưa giao</span></div>
        <div class="stat"><b>${stats.done}</b><span>Đã giao</span></div>
        <div class="stat"><b>${money(stats.revenue)}</b><span>Doanh thu (đã nhận)</span></div>
        <div class="stat"><b>${upcoming.length}</b><span>Đám cưới trong 30 ngày</span></div>
      </div>

      <h2>Sắp cưới <small>30 ngày tới · gửi lời nhắc kèm link quản lý khách</small></h2>
      <div class="card">${upcoming.length ? `<table><thead><tr><th>Ngày</th><th>Cặp đôi</th><th class="hide-sm">Khách đến</th><th></th></tr></thead><tbody>${upcoming.map(r => `
        <tr><td><b>${dmy(r.date)}</b><br><span class="days ${r.days <= 7 ? 'soon' : ''}">${r.days === 0 ? 'Hôm nay' : r.days === 1 ? 'Ngày mai' : `còn ${r.days} ngày`}</span></td>
          <td>${names(r) || esc(r.slug)}<br><small>/${esc(r.slug)}/${r.order ? ' · ' + esc(r.order.phone.replace(/^'/, '')) : ''}</small></td>
          <td class="hide-sm">${r.stats.yes ?? 0} xác nhận · ${r.stats.people ?? 0} người<br><small>${r.stats.wishes ?? 0} lời chúc</small></td>
          <td><div class="acts">${keys[r.slug] ? `<button class="main" type="button" data-copy="${esc(reminder(r, keys[r.slug]))}">Chép lời nhắc</button>` : ''}${r.order ? zalo(r.order.phone) : ''}${links(r.slug)}</div></td></tr>`).join('')}</tbody></table>`
        : '<p class="msg">Không có đám cưới nào trong 30 ngày tới.</p>'}</div>

      <h2>Đơn chờ chuyển khoản <small>tìm giao dịch có nội dung là mã đơn trong app ngân hàng</small></h2>
      <div class="card">${waiting.length ? `<table><thead><tr><th>Mã đơn</th><th>Cặp đôi</th><th class="n">Số tiền</th><th class="hide-sm">Đặt lúc</th><th></th></tr></thead><tbody>${waiting.map(o => `
        <tr><td class="code">${esc(o.code)}</td><td>${esc(o.groom)} &amp; ${esc(o.bride)}<br><small>${esc(o.pack)} · ${esc(o.theme)} · cưới ${dmy(o.date)}</small></td>
          <td class="n">${money(o.price)}</td><td class="hide-sm"><small>${when(o.at)}</small></td><td><div class="acts">${zalo(o.phone)}</div></td></tr>`).join('')}</tbody></table>`
        : '<p class="msg">Không có đơn nào đang chờ tiền.</p>'}</div>

      <h2>Các thiệp <small>${rows.length} thiệp</small></h2>
      <div class="card">${rows.length ? `<table><thead><tr><th>Thiệp</th><th>Ngày cưới</th><th class="n">Đến</th><th class="n hide-sm">Lời chúc</th><th class="n hide-sm">Tim</th><th class="hide-sm">Sửa lần cuối</th><th></th></tr></thead><tbody>${rows.sort((a, b) => (a.date || '9').localeCompare(b.date || '9')).map(r => `
        <tr><td><a href="../${esc(r.slug)}/" target="_blank">/${esc(r.slug)}/</a><br><small>${names(r)}</small></td>
          <td>${dmy(r.date)}${r.days !== null && r.days < 0 ? '<br><small>đã qua</small>' : ''}</td>
          <td class="n">${r.stats.people ?? 0}<br><small>${r.stats.yes ?? 0}/${r.stats.rsvps ?? 0} xác nhận</small></td>
          <td class="n hide-sm">${r.stats.wishes ?? 0}</td><td class="n hide-sm">${r.stats.hearts ?? 0}</td>
          <td class="hide-sm"><small>${content[r.slug]?.savedAt ? when(content[r.slug].savedAt) : 'chưa sửa'}</small></td>
          <td><div class="acts">${links(r.slug)}</div></td></tr>`).join('')}</tbody></table>`
        : '<p class="msg">Chưa có thiệp nào.</p>'}</div>

      <h2>Tất cả đơn <small>${orders.length} đơn, mới nhất trước</small></h2>
      <div class="card">${orders.length ? `<table><thead><tr><th>Mã</th><th>Cặp đôi</th><th>Trạng thái</th><th class="n">Số tiền</th><th class="hide-sm">Đặt lúc</th></tr></thead><tbody>${[...orders].reverse().map(o => `
        <tr><td class="code">${esc(o.code)}</td><td>${esc(o.groom)} &amp; ${esc(o.bride)}<br><small>/${esc(o.slug)}/ · ${esc(o.pack)}</small></td>
          <td><span class="pill ${kind(o.status)}">${esc(o.status || KIND_TEXT[kind(o.status)])}</span></td><td class="n">${money(o.price)}</td><td class="hide-sm"><small>${when(o.at)}</small></td></tr>`).join('')}</tbody></table>`
        : '<p class="msg">Chưa có đơn nào.</p>'}</div>`;
  }

  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-copy]');
    if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Đã chép ✓'; }
    catch { prompt('Chép lời nhắc:', b.dataset.copy); }
  });
  $('#refresh').addEventListener('click', e => { e.preventDefault(); $('#app').innerHTML = '<p class="msg">Đang tải…</p>'; load(); });
  load();
</script>
</body>
</html>
